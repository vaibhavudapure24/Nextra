[theme]
base = "dark"
primaryColor = "#4FC3F7"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1B1F27"
textColor = "#FAFAFA"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
